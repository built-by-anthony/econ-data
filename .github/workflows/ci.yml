name: CI 

on: 
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v8
            - run: uv sync --locked
            - run: uv run black --check . 
            - run: uv run ruff check . 
            - run: uv run pytest -v
            