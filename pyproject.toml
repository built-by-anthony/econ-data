[project]
name = "econ-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "anthony@builtbyanthony.dev" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
econ-data = "econ_data.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.black]
line-length = 88
target-version = ["py311"] 

[tool.ruff]
line-length = 88 
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
