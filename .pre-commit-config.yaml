repos: 
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix 
        language: system 
        types: [python]
     
      - id: black 
        name: black 
        entry: uv run black src tests 
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
      
      - id: pytest
        name: pytest
        entry: uv run pytest -v
        language: system 
        types: [python]
        pass_filenames: false